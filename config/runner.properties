# =========================
# Global defaults
# =========================

# Defaults for CLI-visible knobs (used when args are omitted)
defaults.numModels=-1
defaults.numInitialModels=1
defaults.printModels=true
defaults.extraAnalysis=true
defaults.metricsOnly=false

# Shared caps (used by both LP and SAT unless overridden below)
maxInitial=5
maxIteration=10

# Enumerator sub-run timeout (extraAnalysis) in minutes
processTimeoutMinutes=30

# BatchRunner timeout for each spawned enumerator process
batch.processTimeoutMinutes=150

# =========================
# Optional per-solver overrides
# =========================
# lp.maxInitial=5
# lp.maxIteration=10
# lp.processTimeoutMinutes=30
#
# sat.maxInitial=5
# sat.maxIteration=10
# sat.processTimeoutMinutes=30
